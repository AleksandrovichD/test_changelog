name: Generate Changelog and Tag

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Скачиваем весь репозиторий

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"

      # - name: Install git-cliff
      #   run: |
      #     wget https://github.com
      #     tar -xf git-cliff-linux-amd64.tar.gz
      #     mv git-cliff-linux-amd64/git-cliff .
      
      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
      
      # - name: Set up git-cliff
        # uses: orhun/git-cliff-action@v4
        # with:
          # export-only: true # Просто устанавливает бинарник в систему, не запуская генерацию сразу

      - name: Process Release
        run: |
          # ВАЖНО: Создаем локальную ветку dev, привязанную к origin/dev,
          # чтобы Git внутри GitHub Actions её распознал
          git branch dev origin/dev

          # 1. Находим предыдущий коммит в ветке main
          PREV_MAIN=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          
          # 2. Вычисляем следующую версию на основе коммитов из dev
          NEXT_VERSION=$(git-cliff $PREV_MAIN..dev --bump | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo "0.1.0")
          echo "Calculated next version: v$NEXT_VERSION"
          
          # Если файла CHANGELOG.md еще нет, создаем пустой
          touch CHANGELOG.md

          # 3. Генерируем CHANGELOG.md, подставляя версию
          git-cliff $PREV_MAIN..dev --prepend CHANGELOG.md --tag v$NEXT_VERSION
          
          # 4. Добавляем изменения в коммит (делаем amend сквош-коммита)
          git add CHANGELOG.md
          git commit --amend --no-edit
          
          # 5. Создаем тег на ОТРЕДАКТИРОВАННЫЙ коммит
          git tag -a v$NEXT_VERSION -m "Release v$NEXT_VERSION"
          
          # 6. Отправляем изменения в GitHub
          git push origin main --force
          git push origin v$NEXT_VERSION